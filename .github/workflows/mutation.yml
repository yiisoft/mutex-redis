name: mutation test

on:
  pull_request:
    paths: &paths
      - '.github/workflows/mutation.yml'
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'infection.json.dist'
      - 'phpunit.*.dist'
  push:
    branches: ['master']
    paths: *paths

permissions:
  contents: read

jobs:
  mutation:
    uses: yiisoft/actions/.github/workflows/infection.yml@master
    with:
      ini-values: memory_limit=-1
      os: '["ubuntu-latest"]'
      php: '["8.5"]'
      infection-args: --ignore-msi-with-no-mutations --threads=1
    secrets:
      STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
